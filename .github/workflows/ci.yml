name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }} (ASan/UBSan)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: clang++
            c_compiler: clang
            sanitizers: "-DENABLE_SAN=ON"
          - os: ubuntu-latest
            compiler: g++
            c_compiler: gcc
            sanitizers: "-DENABLE_SAN=ON"
          - os: windows-latest
            compiler: clang++
            c_compiler: clang
            sanitizers: "-DENABLE_SAN=OFF"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Configure CMake
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          ${{ matrix.sanitizers }}

      - name: Build
        run: cmake --build build --config Debug

      - name: Run Tests (ASan + UBSan + Differential)
        run: ctest --test-dir build --output-on-failure -C Debug

      - name: Run Demo
        shell: bash
        run: |
          if [ "${{ runner.os }}" == "Windows" ]; then
            ./build/Debug/fastbook_demo.exe || ./build/fastbook_demo.exe
          else
            ./build/fastbook_demo
          fi
